server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # CSP explícita: o build não usa scripts/estilos inline nem eval, então script-src/style-src
    # ficam restritos a 'self' (+ Google Fonts). connect-src precisa do domínio do backend porque
    # o frontend chama a API em outra origem (dois serviços separados no Render, não um proxy
    # same-origin em produção). img-src/media-src liberam o Supabase Storage (mídia da Comunidade).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.supabase.co; media-src 'self' https://*.supabase.co; connect-src 'self' https://teenbank-api.onrender.com https://sistema-banco-digital.onrender.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    location /api/ {
        proxy_pass         http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
