name: CI — TeenBank

on:
  pull_request:
    branches: [main, dev]

jobs:
  ci-backend:
    name: CI · Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # O npm que vem com o Node 20 é mais antigo que o usado para gerar o lockfile localmente
      # e não entende o formato de dependências opcionais por plataforma (ex.: binários do
      # esbuild) — sem isso, `npm ci` falha com "Missing: ... from lock file".
      - run: npm install -g npm@11
      - run: npm ci --include=dev
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/dummy
      - run: npm run lint
      - run: npm run build
      - run: npm run test
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/dummy
          JWT_SECRET: ci_dummy_secret_not_for_production

  ci-frontend:
    name: CI · Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
